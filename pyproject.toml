[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merganser"
version = "0.1.0"
description = "A self-hosted flashcard application"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "pydantic-settings>=2,<3",
    "pymysql>=1.1,<2",
    "itsdangerous>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/merganser"]
